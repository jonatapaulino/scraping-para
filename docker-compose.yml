services:
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scraper}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-scraper}
      # tarefas longas (PNCP com muitos anexos) passam de 30 min -> 4h
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 14400000"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraper}
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper}
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraper}
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    restart: unless-stopped
    # versao fixa (a mesma que ja rodava): 'latest' mudava sozinha a cada rebuild
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/bitnami/minio/data

  browserless:
    restart: unless-stopped
    image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-scraper}
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 1gb

  api:
    restart: unless-stopped
    build: .
    command: python -m app.main
    env_file: .env
    ports:
      - "${PAINEL_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker-discovery:
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q q.discovery -c 2 -n discovery@%h --loglevel=INFO --max-tasks-per-child=200
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      browserless:
        condition: service_started

  worker-download:
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q q.download -c 4 -n download@%h --loglevel=INFO --max-tasks-per-child=200
    env_file: .env
    volumes:
      - ./downloads:/downloads
      - ./secrets:/secrets:ro
    deploy:
      replicas: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker-control:
    # agenda diaria, reconciliador e disparos do Beat: fila propria (q.control)
    # para nao esperar atras do crawl; 1 processo = agendas nunca em paralelo
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q q.control -c 1 -n control@%h --loglevel=INFO --max-tasks-per-child=200
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    restart: unless-stopped
    build: .
    command: celery -A app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flower:
    restart: unless-stopped
    build: .
    command: celery -A app.celery_app flower --port=5555 --loglevel=INFO
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  postgres-data:
  minio-data:
